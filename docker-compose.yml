# docker compose up -d --build
services:
  diurn:
    build: ./server
    container_name: diurn
    ports:
      - "12321:12321"
    environment:
      # same default as bare-metal: the host user's home is the allowed root
      - DIURN_ROOTS=${HOME}
    volumes:
      - diurn-data:/data           # DB + thumbnail cache live here
      - ${HOME}:${HOME}            # home mounted at its real path, so folder
                                   # settings match bare-metal paths exactly
      # optional: reuse the host's existing diurn DB (HOME=/data puts the DB
      # at /data/.diurn/data.db, so this mount slots right in):
      # - ~/.diurn:/data/.diurn
volumes:
  diurn-data:
